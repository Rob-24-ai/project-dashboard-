<body>
<div id="tower">
<header><div><span class="brand">TOWER</span><h1 id="page-title" tabindex="-1">On your desk</h1></div><div class="connection"><p id="connection-status" role="status" aria-live="polite">Connecting to your sessions…</p><button id="retry" type="button" hidden>Retry connection</button></div></header>
<div class="toolbar"><label class="search-wrap"><span class="sr">Search your work</span><input id="search" type="search" placeholder="Find a piece of work" autocomplete="off" spellcheck="false"></label><nav aria-label="Session views"><button id="desk-view" type="button" aria-pressed="true">On your desk</button><button id="all-view" type="button" aria-pressed="false">All sessions</button></nav></div>
<p id="pin-status" class="warning" role="status" hidden></p>
<p id="peer-status" class="peer-status" role="status" aria-live="polite" hidden></p>
<main id="work" aria-label="Your work"><p class="empty">Checking sessions…</p><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></main>
<div id="notice" role="status" aria-live="polite"></div>
</div>
<button id="back-to-top" type="button" hidden><span aria-hidden="true">↑</span>Back to top</button>
<script>
'use strict';
// Pure view rules are also exercised by page.test.js.
function fullTitle(session) { return String(session.fullTitle || session.searchTitle || session.title || 'Untitled conversation'); }
function appName(session) { return session.agent === 'claude' ? 'Claude' : session.agent === 'codex' ? 'Codex' : 'Unknown app'; }
function stateName(session) { return ({decision:'Needs you',working:'Working',finished:'Finished for now'})[session.state] || 'Status unclear'; }
function isPinned(session) { return !!(session.nativePinned || session.pinned); }
function baseEligible(session, now) { return session.state === 'working' || session.state === 'decision' || session.parked || session.onDesk || isPinned(session) || Number(session.lastActivity) >= now - 86400000; }
function matches(session, query) { return !query || [fullTitle(session),appName(session),session.machine,session.summary?.text,session.question,session.context?.workPath,session.context?.cwd,session.context?.repositoryPath,session.context?.branch].some(value => String(value || '').toLocaleLowerCase().includes(query)); }
function parentMap(sessions) {
  const byId = new Map(sessions.map(session => [session.id,session]));
  const parents = new Map();
  for (const session of sessions) {
    const parentId = session.relationship?.parentId;
    if (!parentId || parentId === session.id || !byId.has(parentId)) continue;
    const seen = new Set([session.id]);
    let cursor = parentId, cyclic = false;
    while (cursor && byId.has(cursor)) {
      if (seen.has(cursor)) { cyclic = true; break; }
      seen.add(cursor); cursor = byId.get(cursor).relationship?.parentId;
    }
    if (!cyclic) parents.set(session.id,parentId);
  }
  return parents;
}
function earlierRequest(session, now) { return session.state==='decision' && (!!session.dismissed || (session.decisionSource!=='permission-prompt' && Number(session.lastActivity)>0 && Number(session.lastActivity)<now-86400000)); }
function selectDesk(sessions, now) {
  const parents = parentMap(sessions), byId = new Map(sessions.map(session => [session.id,session]));
  const selected = new Set(sessions.filter(session => baseEligible(session,now)).map(session => session.id));
  for (const id of [...selected]) { let parent = parents.get(id); while (parent) { selected.add(parent); parent = parents.get(parent); } }
  const attention = sessions.filter(session => session.state === 'decision' && !earlierRequest(session,now));
  const earlier = sessions.filter(session => earlierRequest(session,now));
  const later = sessions.filter(session => session.parked);

async function panelInUse() {
  if(document.hasFocus())return true;
  if(!window.towerLayout?.pointerInside)return document.documentElement.matches(':hover');
  try { return await window.towerLayout.pointerInside(); } catch (_) { return true; }
}
async function resortIfIdle() {
  if(resortOnNextData) { resortOnNextData=false;resort();return; }
  if(shouldResort(false,lastSorted,Date.now()) && !(await panelInUse()))resort();
}
async function refresh(fresh=false) {
  if(refreshing) { await refreshing;if(fresh)return refresh();return; }
  refreshing=(async()=>{
    try { const data=await request('/api/sessions');if(!Array.isArray(data.sessions))throw new Error('Missing sessions');allSessions=data.sessions.map(row => parking.has(row.id) ? {...row,parked:parking.get(row.id)} : row);hasData=true;online=true;now=Number(data.now)||Date.now();lastContact=Date.now();noteSoundCues(allSessions,now);peerView={configured:Array.isArray(data.peers) && data.peers.length>0,remote:data.viewer==='remote' || !isLoopbackHost(location.hostname),machine:typeof data.machine==='string'?data.machine:''};projectBoard=!peerView.remote&&Array.isArray(data.projectBoard?.projects)?data.projectBoard:null;projectBoardStatus=!peerView.remote&&data.projectBoardStatus==='unavailable'?'unavailable':'';document.getElementById('page-title').textContent=view==='desk'&&projectBoard?'Your work, by project.':view==='desk'?'On your desk':'All sessions';renderPinStatus(data.nativePinStatus);renderPeerStatus(data.peers);statusLine.textContent='Connected · Updated '+dateLabel(lastContact);statusLine.classList.remove('offline-label');retry.hidden=true;await resortIfIdle();renderWork(); }
    catch(_) { online=false;statusLine.textContent=hasData?'Disconnected · Showing last received updates':'Cannot connect to Tower';statusLine.classList.add('offline-label');retry.hidden=false;if(hasData)renderWork(true);else work.replaceChildren(element('p','empty','Tower is unavailable. Retry the connection, or open the Tower launcher.')); }
  })();
  await refreshing;refreshing=null;
}
search.addEventListener('input',()=>renderWork(true));
document.getElementById('desk-view').addEventListener('click',()=>setView('desk'));
document.getElementById('all-view').addEventListener('click',()=>setView('all'));
retry.addEventListener('click',()=>refresh());
window.addEventListener('resize',()=>{
  const count=projectColumnsForWidth(window.innerWidth);if(count===projectColumnCount)return;
  projectColumnCount=count;if(view==='desk'&&projectBoard)renderWork(true);
},{passive:true});
const backToTop=document.getElementById('back-to-top');
function updateBackToTop(){backToTop.hidden=window.scrollY<320;}
document.addEventListener('scroll',updateBackToTop,{passive:true});
backToTop.addEventListener('click',()=>{
  document.getElementById('page-title').focus({preventScroll:true});
  window.scrollTo({top:0,behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
updateBackToTop();
// Coming back to the page re-sorts from fresh data, not what was cached while away.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resortOnNextData=true;refresh(true);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape' && document.activeElement===search && search.value){search.value='';renderWork(true);}});
refresh();setInterval(refresh,3000);
</script>
</body>
</html>
