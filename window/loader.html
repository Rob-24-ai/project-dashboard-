<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #13151b; color: #b7bdc9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .box { text-align: left; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ffffff; margin-right: 8px;
    animation: pulse 1.2s ease-in-out infinite;
    vertical-align: middle;
  }
  .msg { font-size: 13px; letter-spacing: 0.3px; vertical-align: middle; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="box"><span class="dot"></span><span class="msg">Connecting&hellip;</span></div>
</body>
</html>
